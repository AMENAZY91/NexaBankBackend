spring.application.name=nexabank-api

server.port=${SERVER_PORT:8080}

# dev activa LoggingOtpSender (service/otp/LoggingOtpSender.java, @Profile({"dev","test"})) —
# sin un perfil activo, Spring Boot cae al perfil "default" (no "dev"), y ningun OtpSender
# califica: ni LoggingOtpSender (pide dev/test) ni TwilioOtpSender (pide prod/staging).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

logging.level.com.nexabank=INFO

management.endpoint.health.show-details=when-authorized
